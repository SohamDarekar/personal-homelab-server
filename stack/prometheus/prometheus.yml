global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { instance: homelab }
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: gpu                       # optional: the NVIDIA GPU exporter on this machine (port 9835). It shows as down when none runs.
    static_configs:
      - targets: ["host.docker.internal:9835"]
        labels: { instance: homelab }
